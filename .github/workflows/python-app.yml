
name: Python application

on:
  push:
    branches: [ "master", "develop" ]
  pull_request:
    branches: [ "master", "develop" ]

permissions:
  contents: write        # For checkout and comparing commits
  pull-requests: write  # For creating/updating PR comments

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python 3.12.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.12.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Install the code linting and formatting tool Ruff
      run: pipx install ruff
    - name: Lint code with Ruff
      run: ruff check --output-format=github --target-version=py39
    - name: Check code formatting with Ruff
      run: ruff format --diff --target-version=py39
      continue-on-error: true
#    - name: type check 
#      run: mypy src

  unit-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: codecov/codecov-action@v4
    - uses: actions/checkout@v6
    - name: Set up Python 3.12.11
      uses: actions/setup-python@v5      
      with:
        python-version: "3.12.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - run: coverage run --parallel-mode -m pytest tests/unit/object_segmentation/  -v --cov=. --cov-report=term-missing --cov-report=html --cov-report xml 
  
    - run: coverage run --parallel-mode -m pytest tests/unit/backend/  -v --cov=. --cov-report=term-missing --cov-report=html --cov-report xml   
    
    - run: coverage run --parallel-mode -m pytest tests/unit/utils/  -v --cov=. --cov-report=term-missing --cov-report=html --cov-report xml 

    - run: coverage combine

    - name: Coverage comment
      uses: MishaKav/pytest-coverage-comment@v1
      with:
        pytest-xml-coverage-path: ./coverage.xml
        junitxml-path: ./pytest.xml

        
